# ============================================================
# ALEMBIC CONFIGURATION
# ============================================================

[alembic]

# Tunaambia Alembic kwamba migration scripts zipo kwenye
# folder la alembic ndani ya project.
script_location = %(here)s/alembic


# ============================================================
# DATABASE URL
# ============================================================

# Kwa sasa URL ya database inaweza kuwekwa hapa.
# Kama kwenye project yako env.py inasoma DATABASE_URL kutoka
# .env, tunaweza kuiacha hivi na kutumia env.py yetu.
sqlalchemy.url = postgresql://postgres:password@localhost:5432/hiremind_ai


# ============================================================
# LOGGING CONFIGURATION
# ============================================================

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S