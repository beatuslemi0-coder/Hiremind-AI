<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

```
<title>Results - Student Results System</title>

<link rel="stylesheet" href="css/style.css">
```

</head>

<body>

```
<nav class="navbar">

    <h2>🎓 Student Results System</h2>

    <div>
        <a href="dashboard.html" class="nav-link">
            Dashboard
        </a>

        <button id="logoutBtn">
            Logout
        </button>
    </div>

</nav>


<main class="page-container">

    <h1>Manage Results </h1>

    <p>
        Enter and manage students' subject marks.
    </p>


    <!-- ADD RESULT -->

    <section class="form-card">

        <h2>Add Student Result</h2>

        <form id="resultForm">

            <div class="form-group">

                <label for="studentSelect">
                    Student
                </label>

                <select id="studentSelect" required>

                    <option value="">
                        Select Student
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label for="subjectSelect">
                    Subject
                </label>

                <select id="subjectSelect" required>

                    <option value="">
                        Select Subject
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label for="marks">
                    Marks
                </label>

                <input
                    type="number"
                    id="marks"
                    min="0"
                    max="100"
                    placeholder="Enter marks (0 - 100)"
                    required
                >

            </div>


            <button type="submit">
                Save Result
            </button>

            <p id="resultMessage"></p>

        </form>

    </section>
    <section class="form-card" id="editResultSection" style="display: none;">

    <h2>Edit Result</h2>

    <form id="editResultForm">

        <div class="form-group">

            <label>Student</label>

            <input
                type="text"
                id="editStudent"
                readonly
            >

        </div>


        <div class="form-group">

            <label>Subject</label>

            <input
                type="text"
                id="editSubject"
                readonly
            >

        </div>


        <div class="form-group">

            <label>Marks</label>

            <input
                type="number"
                id="editMarks"
                min="0"
                max="100"
                required
            >

        </div>


        <button type="submit">
            Update Result
        </button>


        <button
            type="button"
            id="cancelEditResult">
            Cancel
        </button>

    </form>

</section>


    <!-- RESULTS TABLE -->

    <section class="table-card">

        <h2>Results List</h2>
        <!-- Search ya kutafuta result kwa mwanafunzi au subject -->
        <div class="results-search">
            <input
                type="text"
                id="searchResult"
                placeholder="Search student or subject..."
            />
        </div>


        <table>

            <thead>

                <tr>

                    <th>ID</th>
                    <th>Student</th>
                    <th>Subject</th>
                    <th>Marks</th>
                    <th>Actions</th>

                </tr>

            </thead>


            <tbody id="resultsTable">

                <!-- Results will appear here -->

            </tbody>

        </table>

    </section>


</main>


<script src="js/results.js"></script>
```

</body>

</html>
