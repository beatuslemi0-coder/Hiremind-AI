<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

```
<title>Register - Student Results System</title>

<link rel="stylesheet" href="css/style.css">
```

</head>

<body class="register-page">

```
<!-- Decorative water ripples -->
<div class="water-ripple ripple-1"></div>
<div class="water-ripple ripple-2"></div>
<div class="water-ripple ripple-3"></div>


<div class="register-container">

    <div class="register-card">

        <div class="register-icon">
            🎓
        </div>

        <h1>Create Account</h1>

        <p class="register-subtitle">
            Register to use the Student Results System
        </p>

        <form id="registerForm">

            <div class="form-group">
                <label for="fullName">Full Name</label>

                <input
                    type="text"
                    id="fullName"
                    placeholder="Enter your full name"
                    required
                >
            </div>

            <div class="form-group">
                <label for="email">Email</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Create a password"
                    required
                >
            </div>

            <button type="submit" class="register-btn">
                Create Account
            </button>

            <p id="message"></p>

        </form>

        <div class="divider">
            <span></span>
            <p>OR</p>
            <span></span>
        </div>

        <p class="auth-link">
            Already have an account?
            <a href="index.html">Login here</a>
        </p>

    </div>

</div>

<script src="js/register.js"></script>
```

</body>
</html>
